name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  redis-cli-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - run: pip install -e .
      - name: Real redis-cli against Mini Redis
        run: |
          python -m miniredis --port 6399 &
          sleep 1
          set -e
          [ "$(redis-cli -p 6399 PING)" = "PONG" ]
          redis-cli -p 6399 SET k hello
          [ "$(redis-cli -p 6399 GET k)" = "hello" ]
          redis-cli -p 6399 RPUSH l a b c
          [ "$(redis-cli -p 6399 LLEN l)" = "3" ]
          [ "$(redis-cli -p 6399 INCR n; redis-cli -p 6399 INCR n)" = "1
2" ]
