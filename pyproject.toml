[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniredis"
version = "0.1.0"
description = "An in-memory data store speaking the Redis RESP protocol, built from scratch: threaded TCP server, key expiry, strings/lists/hashes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["redis", "resp", "tcp-server", "cache", "key-value", "from-scratch"]

[project.scripts]
miniredis = "miniredis.server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["miniredis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
